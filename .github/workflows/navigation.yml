name: navigation
on: [pull_request, workflow_dispatch]
jobs:
  native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - run: cargo test -p scene-navigation
      - run: cargo test -p wgpu-testbed-lib
      - run: cargo clippy --workspace --all-targets -- -D warnings
  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build --release --target web --out-dir pkg-web
        working-directory: wgpu-testbed-lib
      - run: wasm-pack build --release --target bundler --out-dir pkg
        working-directory: wgpu-testbed-lib
      - run: npm ci
        working-directory: wgpu-testbed-webapp
      - run: npm run build
        working-directory: wgpu-testbed-webapp
      - run: npm run test:navigation
        working-directory: wgpu-testbed-webapp
        env:
          BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:navigation
        working-directory: wgpu-testbed-webapp
        env:
          BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          WASM_HOST: bundler
